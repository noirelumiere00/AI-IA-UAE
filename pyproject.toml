[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiia"
version = "0.1.0"
description = "AI-IA-UAE — 広告PR会社向けマルチエージェント基盤（第1弾: 朝のメール確認サポートAgent）"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# 本番でBedrock/Claude APIを使う場合のみ。テスト/雛形検証(HeuristicLLM)には不要。
bedrock = ["anthropic[bedrock]>=0.40"]
api = ["anthropic>=0.40"]
# 多人数(40-50人): per-user OAuth + DynamoDB+KMS + 実Gmail + Slack配信 + connect_web。
multiuser = [
  "boto3>=1.34",
  "google-api-python-client>=2.0",
  "google-auth>=2.0",
  "google-auth-oauthlib>=1.0",
  "slack_sdk>=3.27",
  "slack_bolt>=1.18",
  "aiohttp>=3.9",        # slack_bolt AsyncApp/Socket Mode が要求
  "fastapi>=0.110",
  "uvicorn>=0.29",
]
# §Q aiia-mcp: AiLaのメール機能を streamable-http MCP サーバとして公開（OpenClaw配下バックエンド）。
# teamagent run_mcp_http_server パターン流用。per-user resolver(slack_user_id→email)内蔵・bearer。
aiia_mcp = [
  # streamable_http_manager は mcp 1.8.0 で追加（run_mcp_http_server.py が必須要求）。
  # CVE-2026-52869/52870 (GHSA-jpw9-pfvf-9f58: <=1.27.1 はbearer下でもJSON-RPC注入可) 対応で下限を1.27.2に。
  "mcp>=1.27.2",
  "starlette>=0.37",
  "uvicorn>=0.29",
  "boto3>=1.34",
  "google-api-python-client>=2.0",
  "google-auth>=2.0",
  "slack_sdk>=3.27",
  "structlog>=24.0",
]
# connect_web を AWS Lambda + Function URL で公開する最小依存（§V6改・ngrok/ドメイン不要）。
# OAuthコールバック(/oauth2/*)＋/reply(全返信下書き)を1 Lambdaが捌く。uvicorn/slack_bolt/anthropic は不要。
# boto3 は Lambda ランタイム同梱のため除外（パッケージ削減）。
lambda = [
  "mangum>=0.17",
  "fastapi>=0.110",
  "google-auth>=2.0",
  "google-auth-oauthlib>=1.0",
  "google-api-python-client>=2.0",
  "slack_sdk>=3.27",
]
dev = ["pytest>=8.2", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
aiia-morning-email = "aiia.scripts.run_morning_email:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aiia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
